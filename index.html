<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS AI</title>
<meta name="description" content="CS AI Personal Assistant">
<meta name="theme-color" content="#090C11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CS AI">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- Light, premium palette matched to the C.S Company shield logo (blue shield / green S) ---- */
    --bg0:#EEF2F8;
    --bg1:#FFFFFF;
    --bg2:#FFFFFF;
    --bg3:#F4F7FB;
    --bg4:#EAF0F8;
    --surface:#F1F4F9;
    --surface-strong:#E7EDF6;
    --panel:#FFFFFF;
    --panel-alt:#F7F9FC;
    --line:rgba(16,24,40,0.12);
    --line-soft:rgba(16,24,40,0.07);
    --text0:#101828;
    --text1:#475467;
    --text2:#667085;
    --text3:#98A2B3;

    --primary:#2F6FED;
    --primary-dim:#1D4FBF;
    --primary-ink:#FFFFFF;
    --primary-soft:rgba(47,111,237,0.14);
    --primary-bg:rgba(47,111,237,0.07);

    --accent:#22C55E;
    --accent-dim:#15803D;
    --accent-ink:#052E14;
    --accent-soft:rgba(34,197,94,0.16);
    --accent-bg:rgba(34,197,94,0.08);

    --highlight-gold:#C88A34;
    --highlight-gold-dim:#A56E24;

    --blue:#2F6FED;
    --blue-soft:rgba(47,111,237,0.12);
    --green:#22C55E;
    --green-soft:rgba(34,197,94,0.14);
    --amber:#D97706;
    --amber-soft:rgba(217,119,6,0.14);
    --red:#E11D48;
    --red-soft:rgba(225,29,72,0.12);

    --shadow:rgba(16, 24, 40, 0.16);
    --radius:12px;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'JetBrains Mono', monospace;
    --vh:1vh;
    --app-vh:100vh;
    --keyboard-offset:0px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:
      radial-gradient(circle at top left, rgba(47, 111, 237, 0.07), transparent 32%),
      radial-gradient(circle at right center, rgba(34, 197, 94, 0.05), transparent 34%),
      linear-gradient(180deg, #EEF2F8 0%, #E7ECF4 100%);
    color:var(--text0);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:14px;
    min-height:100%;
    overflow:hidden;
    scroll-behavior:smooth;
  }
  html {
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  body {
    overflow-x:hidden;
    overflow-y:auto;
  }
  ::selection{background:var(--primary-soft);color:var(--primary-dim);}
  ::-webkit-scrollbar{width:11px;height:11px;}
  ::-webkit-scrollbar-track{background:rgba(16, 24, 40, 0.02);border-radius:999px;}
  ::-webkit-scrollbar-thumb{background:linear-gradient(180deg, rgba(47, 111, 237, 0.55), rgba(34, 197, 94, 0.45));border-radius:999px;border:2px solid rgba(238, 242, 248, 0.92);box-shadow:0 0 8px rgba(47, 111, 237, 0.14);transition:all .2s ease;}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg, rgba(47, 111, 237, 0.75), rgba(34, 197, 94, 0.60));}

  button{font-family:var(--sans);cursor:pointer;transition:all .2s ease;}
  input,textarea,select{
    font-family:var(--sans);
    background-color:var(--surface);
    color:var(--text0);
    border:1px solid var(--line);
    -webkit-appearance:none;
    appearance:none;
    caret-color:var(--primary);
  }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus{
    -webkit-text-fill-color:var(--text0);
    -webkit-box-shadow:0 0 0px 1000px var(--surface) inset;
    box-shadow:0 0 0px 1000px var(--surface) inset;
    transition:background-color 9999s ease-in-out 0s;
  }

  #app{
    display:grid;
    grid-template-columns:236px 1fr;
    width:min(1200px, calc(100vw - 22px));
    height:calc(100vh - 18px);
    min-height:560px;
    overflow:hidden;
    background:#FFFFFF;
    border:1px solid rgba(16, 24, 40, 0.08);
    border-radius:24px;
    box-shadow:
      0 22px 70px rgba(16, 24, 40, 0.16),
      0 2px 6px rgba(16, 24, 40, 0.06),
      0 0 0 1px rgba(16, 24, 40, 0.02);
    position:relative;
  }
  #app::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at top right, rgba(47, 111, 237, 0.05), transparent 30%),
      radial-gradient(circle at bottom left, rgba(34, 197, 94, 0.04), transparent 34%);
    pointer-events:none;
  }

  /* ---------- SIDEBAR ---------- */
  #sidebar{
    background:#FBFCFE;
    border-right:1px solid rgba(16, 24, 40, 0.08);
    display:flex;
    flex-direction:column;
    padding:0 14px 12px 14px;
    overflow:hidden;
  }
  .brand{
    display:flex;align-items:center;gap:11px;
    padding:12px 9px 13px 9px;
    border-bottom:1px solid rgba(16, 24, 40, 0.08);
    margin-bottom:8px;
    background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.50));
    border-radius:12px;
    position:sticky;
    top:0;
    z-index:10;
    flex-shrink:0;
  }
  .brand-mark{
    width:38px;height:38px;border-radius:12px;
    background:#FFFFFF;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    flex-shrink:0;
    box-shadow:0 10px 22px rgba(47, 111, 237, 0.22), 0 1px 3px rgba(16,24,40,0.10);
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-text{line-height:1.1;}
  .brand-text b{font-family:var(--serif);font-size:17px;font-weight:700;display:block;color:var(--text0);letter-spacing:-.015em;}
  .brand-text span{font-size:10px;color:var(--text2);letter-spacing:.07em;text-transform:uppercase;font-weight:700;}

  nav{display:flex;flex-direction:column;gap:5px;padding:0 0 12px 0;}
  .nav-btn{
    display:flex;align-items:center;gap:10px;
    background:transparent;border:none;color:var(--text1);
    padding:9px 11px;border-radius:10px;font-size:13px;font-weight:500;
    text-align:left;width:100%;
    transition:all .22s cubic-bezier(.2,.3,.25,.9);
    border:1px solid transparent;
  }
  .nav-btn .ic{font-size:15px;width:18px;text-align:center;}
  .nav-btn:hover{background:var(--primary-bg);color:var(--text0);border-color:rgba(47, 111, 237, 0.14);transform:translateX(2px);}
  .nav-btn.active{background:var(--primary-soft);color:var(--primary-dim);border-color:rgba(47, 111, 237, 0.24);box-shadow:0 4px 12px rgba(47, 111, 237, 0.10);}

  .sidebar-section{margin-top:18px;}
  .section-label{display:flex;align-items:center;justify-content:space-between;padding:0 8px 10px;color:var(--text2);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;}
  .section-label .tiny-btn, .tiny-btn{
    background:#FFFFFF;
    border:1px solid var(--line);
    border-radius:8px;padding:5px 8px;color:var(--text1);font-size:9.5px;font-weight:700;
    transition:all .18s ease;
  }
  .section-label .tiny-btn:hover, .tiny-btn:hover{border-color:rgba(34, 197, 94, 0.45);color:var(--accent-dim);background:var(--accent-bg);}
  .history-list{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 380px);overflow-y:auto;padding-right:3px;}
  .history-item{
    display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 11px;border-radius:13px;background:#FFFFFF;border:1px solid var(--line-soft);cursor:pointer;color:var(--text0);text-align:left;transition:all .24s cubic-bezier(.2,.3,.25,.9);
  }
  .history-item:hover{border-color:rgba(47, 111, 237, 0.28);box-shadow:0 6px 16px rgba(16,24,40,0.08);transform:translateX(3px);}
  .history-item.active{border-color:rgba(34, 197, 94, 0.40);background:var(--accent-bg);box-shadow:0 6px 16px rgba(34, 197, 94, 0.10);}
  .history-main{min-width:0;flex:1;}
  .history-title{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text0);}
  .history-meta{font-size:10px;color:var(--text2);margin-top:3px;font-weight:500;}
  .history-actions{display:flex;gap:6px;flex-shrink:0;}
  .mini-action{width:24px;height:24px;border-radius:9px;border:1px solid var(--line);background:#FFFFFF;color:var(--text1);font-size:11px;display:inline-flex;align-items:center;justify-content:center;transition:all .18s ease;}
  .mini-action:hover{border-color:rgba(47, 111, 237, 0.40);color:var(--primary);}

  .sidebar-foot{
    margin-top:auto;padding-top:16px;border-top:1px solid rgba(16, 24, 40, 0.08);
    font-size:10.5px;color:var(--text2);line-height:1.7;
    padding-bottom:4px;
  }
  .sidebar-foot b{color:var(--text0);font-weight:800;}
  .sidebar-foot .db-status{display:flex;align-items:center;gap:7px;margin-top:12px;font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.04em;}
  .sidebar-foot .dot{width:8px;height:8px;border-radius:50%;background:var(--text2);flex-shrink:0;transition:all .3s ease;box-shadow:0 0 6px currentColor;}
  .sidebar-foot .dot.ok{background:#16A34A;box-shadow:0 0 10px rgba(22,163,74,.4);}
  .sidebar-foot .dot.bad{background:#DC2626;box-shadow:0 0 10px rgba(220,38,38,.4);}

  /* ---------- MAIN ---------- */
  #main{
    display:flex;flex-direction:column;
    height:100vh;
    min-width:0;
    width:100%;
    overflow:hidden;
    background:#FFFFFF;
  }

  #topbar{
    padding:12px 20px;border-bottom:1px solid rgba(16, 24, 40, 0.08);
    background:#FFFFFF;
    display:flex;justify-content:space-between;align-items:center;
    gap:14px;flex-shrink:0;flex-wrap:nowrap;
    width:100%;
    min-width:0;
    box-shadow:0 1px 0 rgba(16,24,40,0.02), 0 6px 14px rgba(16,24,40,0.03);
    position:relative;top:auto;left:auto;z-index:2;
  }
  .topbar-logo{width:38px;height:38px;border-radius:11px;overflow:hidden;flex-shrink:0;background:#FFFFFF;box-shadow:0 6px 16px rgba(47, 111, 237, 0.20), 0 1px 3px rgba(16,24,40,0.10);}
  .topbar-logo img{width:100%;height:100%;object-fit:cover;display:block;}
  #menuToggleBtn{
    display:none;
    width:38px;height:38px;border-radius:11px;flex-shrink:0;
    background:#FFFFFF;border:1px solid var(--line);color:var(--text0);
    font-size:16px;align-items:center;justify-content:center;
    box-shadow:0 2px 6px rgba(16,24,40,0.05);
  }
  #sidebarBackdrop{display:none;position:fixed;inset:0;background:rgba(16,24,40,0.45);z-index:19;}
  #sidebarBackdrop.show{display:block;}
  .topbar-head{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto;}
  .greet{min-width:0;flex:1 1 auto;}
  .greet h1{font-family:var(--serif);font-size:19px;font-weight:700;margin:0 0 2px;color:var(--text0);letter-spacing:-.01em;}
  .greet p{margin:0;font-size:12px;color:var(--text2);font-weight:500;}
  .pulse-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0;min-width:0;justify-content:flex-end;}
  .pulse-label{font-size:9.5px;color:var(--text2);letter-spacing:.08em;text-transform:uppercase;font-weight:700;font-family:var(--mono);text-align:right;}
  #pulseSvg{width:120px;height:36px;}
  .stat-chips{display:flex;gap:10px;flex-wrap:nowrap;flex-shrink:0;justify-content:flex-end;}
  .chip{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:7px 12px;border-radius:12px;background:var(--bg3);
    border:1px solid var(--line-soft);
    min-width:54px;
    transition:all .22s ease;
  }
  .chip:hover{
    border-color:rgba(47, 111, 237, 0.28);
    box-shadow:0 6px 14px rgba(16,24,40,0.06);
  }
  .chip b{font-family:var(--mono);font-size:14px;color:var(--text0);font-weight:700;}
  .chip span{font-size:8.5px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}

  .view{flex:1;overflow-y:auto;display:none;}
  .view.active{display:flex;flex-direction:column;}

  /* ---------- CHAT VIEW ---------- */
  #chatView{padding:0;}
  .workspace-shell{
    display:flex;
    width:100%;
    height:100%;
    padding:14px 14px 12px;
    min-height:0;
    background:var(--bg0);
  }
  .chat-panel{
    background:#FFFFFF;
    border:1px solid rgba(16, 24, 40, 0.08);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(16, 24, 40, 0.08);
    display:flex;flex-direction:column;min-height:0;flex:1;
  }
  #chatSubheader{display:flex;justify-content:flex-end;gap:8px;padding:10px 26px 0;flex-shrink:0;}
  #historyPanel{display:none;flex:1;overflow-y:auto;padding:16px 26px;background:#FFFFFF;}
  #imagePreviewRow{display:none;align-items:center;gap:10px;padding:10px 26px;background:var(--bg3);border-top:1px solid var(--line-soft);flex-shrink:0;}
  #imagePreviewThumb{max-height:56px;border-radius:8px;border:1px solid var(--line);box-shadow:0 6px 14px rgba(16,24,40,0.08);}
  #chatLog{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;background:#FFFFFF;}
  .msg{max-width:640px;display:flex;gap:11px;}
  .msg.ai{align-self:flex-start;}
  .msg.user{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{
    width:32px;height:32px;border-radius:8px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;font-weight:600;
  }
  .msg.ai .avatar{background:var(--primary-soft);color:var(--primary-dim);border:1px solid rgba(47, 111, 237, 0.20);}
  .msg.user .avatar{background:var(--accent-soft);color:var(--accent-dim);border:1px solid rgba(34, 211, 153, 0.24);}
  .bubble{
    padding:13px 16px;border-radius:16px;font-size:14px;line-height:1.68;
    white-space:pre-line;
    word-wrap:break-word;overflow-wrap:break-word;
  }
  .msg.ai .bubble{background:var(--bg3);border:1px solid var(--line-soft);color:var(--text0);border-top-left-radius:4px;}
  .msg.user .bubble{background:linear-gradient(135deg, var(--accent), var(--accent-dim));color:#FFFFFF;border-top-right-radius:4px;font-weight:600;box-shadow:0 10px 20px rgba(34, 197, 94, 0.22);}
  .chip-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:2px;}
  .code-block{background:#0F172A;border-radius:10px;overflow:hidden;margin:8px 0;border:1px solid rgba(255,255,255,0.08);}
  .code-block-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1E293B;font-family:var(--mono);font-size:11px;color:#94A3B8;text-transform:uppercase;letter-spacing:.04em;}
  .code-copy-btn{background:transparent;border:1px solid rgba(255,255,255,0.18);color:#CBD5E1;padding:3px 9px;border-radius:6px;font-size:10.5px;cursor:pointer;font-family:var(--sans);}
  .code-copy-btn:hover{background:rgba(255,255,255,0.10);}
  .code-block pre{margin:0;padding:12px 14px;overflow-x:auto;}
  .code-block code{font-family:var(--mono);font-size:12.5px;color:#E2E8F0;white-space:pre;line-height:1.55;}
  .pick{
    background:#FFFFFF;border:1px solid var(--line);color:var(--text0);
    padding:8px 14px;border-radius:22px;font-size:12.5px;transition:all .22s cubic-bezier(.2,.3,.25,.9);
    box-shadow:0 4px 10px rgba(16,24,40,0.05);
  }
  .pick:hover{border-color:rgba(34, 197, 94, 0.45);color:var(--accent-dim);background:var(--accent-bg);box-shadow:0 6px 16px rgba(34, 197, 94, 0.14);transform:translateY(-2px);}

  #quickRow{
    padding:12px 28px;border-top:1px solid var(--line-soft);
    display:flex;gap:10px;flex-wrap:wrap;background:#FBFCFE;
  }
  .quick{
    background:#FFFFFF;border:1px solid var(--line);color:var(--text1);
    padding:10px 16px;border-radius:999px;font-size:12.5px;white-space:nowrap;font-weight:600;
    transition:all .24s cubic-bezier(.2,.3,.25,.9);
    box-shadow:0 4px 10px rgba(16,24,40,0.05);
  }
  .quick:hover{border-color:rgba(34, 197, 94, 0.40);color:var(--accent-dim);background:var(--accent-bg);box-shadow:0 8px 18px rgba(34, 197, 94, 0.12);transform:translateY(-2.5px);}

  #inputRow{
    padding:12px 20px 16px;border-top:1px solid var(--line-soft);
    display:flex;gap:12px;background:#FBFCFE;flex-shrink:0;
    margin-top:auto;
  }
  #authOverlay{
    position:fixed;inset:0;background:rgba(16, 24, 40, 0.55);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:80;
  }
  #authOverlay.hidden{display:none;}
  .auth-card{
    width:min(420px, calc(100vw - 32px));background:#FFFFFF;
    border:1px solid rgba(16, 24, 40, 0.08);border-radius:28px;padding:32px;box-shadow:0 30px 90px rgba(16,24,40,0.28);
  }
  .auth-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;}
  .auth-header h3{margin:0;font-family:var(--serif);font-size:32px;font-weight:700;background:linear-gradient(135deg, var(--primary), var(--accent-dim));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .auth-pill{padding:6px 11px;border-radius:999px;background:var(--primary-soft);color:var(--primary-dim);font-size:10.5px;border:1px solid rgba(47, 111, 237, 0.30);font-weight:600;letter-spacing:.02em;}
  .auth-form{display:flex;flex-direction:column;gap:14px;}
  .auth-form label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
  .auth-form input{
    width:100%;padding:13px 16px;border-radius:15px;border:1px solid var(--line);background:var(--surface);
    color:var(--text0);font-size:14px;outline:none;transition:all .24s ease;
  }
  .auth-form input::placeholder{color:var(--text3);}
  .auth-form input:focus{border-color:rgba(47, 111, 237, 0.55);background:#FFFFFF;box-shadow:0 0 0 4px rgba(47, 111, 237, 0.12);}
  .auth-actions{display:flex;gap:12px;margin-top:16px;}
  .auth-actions .btn{flex:1;padding:12px 16px;font-size:13.5px;}
  #authMessage{min-height:18px;font-size:12px;color:var(--red);margin-top:2px;}
  .logout-btn{
    margin-top:12px;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#FFFFFF;color:var(--text1);transition:all .2s ease;
  }
  .logout-btn:hover{border-color:rgba(225, 29, 72, 0.35);color:var(--red);background:var(--red-soft);}
  #chatInput{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text0);
    padding:11px 14px;border-radius:14px;font-size:14px;outline:none;font-weight:500;
    transition:all .24s cubic-bezier(.2,.3,.25,.9);
  }
  #chatInput::placeholder{color:var(--text3);opacity:1;}
  #chatInput:focus{border-color:rgba(47, 111, 237, 0.50);background:#FFFFFF;box-shadow:0 0 0 3px rgba(47, 111, 237, 0.14);}
  #sendBtn{
    background:linear-gradient(135deg, var(--primary), var(--primary-dim));
    border:1px solid rgba(47, 111, 237, 0.40);
    color:#FFFFFF;
    font-weight:800;
    padding:0 22px;
    border-radius:14px;
    font-size:13.5px;
    box-shadow:0 10px 24px rgba(47, 111, 237, 0.30);
    transition:all .24s cubic-bezier(.2,.3,.25,.9);
    cursor:pointer;
  }
  #sendBtn:hover{
    background:linear-gradient(135deg, #4C8DFF, var(--primary));
    box-shadow:0 14px 30px rgba(47, 111, 237, 0.36);
    transform:translateY(-2px);
  }
  #sendBtn:active{transform:scale(.96);}
  #sendBtn:disabled{opacity:.45;cursor:default;transform:none;}
  #genImageBtn.active{background:var(--accent-soft);border-color:rgba(34,197,94,0.45);color:var(--accent-dim);}

  /* ---------- GENERIC PANELS ---------- */
  .panel{padding:24px 28px;overflow-y:auto;flex:1;}
  .panel h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0 0 4px;color:var(--text0);}
  .panel .sub{color:var(--text2);font-size:12.5px;margin:0 0 20px;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px;}
  .metric{background:var(--bg3);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;}
  .metric span{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;}
  .metric b{display:block;font-family:var(--mono);font-size:22px;margin-top:6px;color:var(--text0);}
  .metric.gold b{color:var(--highlight-gold);}
  .metric.green b{color:var(--green);}
  .metric.amber b{color:var(--amber);}
  .metric.red b{color:var(--red);}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin:26px 0 10px;font-family:var(--mono);}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--text2);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line-soft);}
  td{padding:10px;border-bottom:1px solid var(--line-soft);color:var(--text0);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:600;}
  .tag.pending{background:var(--amber-soft);color:var(--amber);}
  .tag.contract{background:var(--green-soft);color:var(--accent-dim);}
  .tag.lost{background:var(--red-soft);color:var(--red);}
  .tag.started{background:var(--blue-soft);color:var(--primary-dim);}
  .tag.completed{background:var(--green-soft);color:var(--accent-dim);}
  .tag.delayed{background:var(--red-soft);color:var(--red);}

  .btn{
    background:#FFFFFF;
    border:1px solid var(--line);
    color:var(--text0);
    padding:9px 15px;
    border-radius:12px;
    font-size:12.5px;
    font-weight:600;
    box-shadow:0 2px 6px rgba(16,24,40,0.04);
    transition:all .22s cubic-bezier(.2,.3,.25,.9);
    cursor:pointer;
  }
  .btn:hover{
    border-color:rgba(34, 197, 94, 0.40);
    color:var(--accent-dim);
    background:var(--accent-bg);
    box-shadow:0 6px 16px rgba(34, 197, 94, 0.12);
    transform:translateY(-2px);
  }
  .btn.primary{
    background:linear-gradient(135deg, var(--primary), var(--primary-dim));
    color:#FFFFFF;
    border:1px solid rgba(47, 111, 237, 0.40);
    font-weight:800;
    box-shadow:0 10px 24px rgba(47, 111, 237, 0.26);
  }
  .btn.primary:hover{
    background:linear-gradient(135deg, #4C8DFF, var(--primary));
    box-shadow:0 14px 30px rgba(47, 111, 237, 0.32);
    transform:translateY(-2px);
    color:#FFFFFF;
  }
  .btn.small{padding:4px 10px;font-size:11.5px;}
  .btn:disabled{opacity:.55;cursor:default;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;max-width:640px;}
  .form-grid label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;}
  .form-grid input,.form-grid select{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--text0);
    padding:9px 11px;border-radius:8px;font-size:13.5px;outline:none;
  }
  .form-grid input:focus,.form-grid select:focus{border-color:rgba(47, 111, 237, 0.45);background:#FFFFFF;}
  .form-full{grid-column:1/-1;}

  .empty{color:var(--text2);font-size:13px;padding:30px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius);}

  .kanban{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .kcol{background:var(--bg3);border:1px solid var(--line-soft);border-radius:var(--radius);padding:12px;min-height:120px;}
  .kcol h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;color:var(--text2);}
  .kcard{background:#FFFFFF;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;box-shadow:0 2px 6px rgba(16,24,40,0.04);}
  .kcard b{display:block;font-size:13.5px;margin-bottom:3px;color:var(--text0);}
  .kcard .meta{font-size:11px;color:var(--text2);}
  .kcard .krow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}

  .report-block{background:var(--bg3);border:1px solid var(--line-soft);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .report-block h3{font-family:var(--serif);font-size:15px;margin:0 0 10px;color:var(--text0);}

  @media(max-width:820px){
    html,body{
      padding:0;
      min-height:100%;
      height:100%;
      display:block;
      background:linear-gradient(180deg, #EEF2F8 0%, #E7ECF4 100%);
      overflow:hidden;
    }
    html {
      overflow:hidden;
      -webkit-overflow-scrolling:touch;
    }
    body {
      overflow:hidden;
    }
    #app{
      grid-template-columns:1fr;
      width:100vw;
      height:100vh;
      height:100dvh;
      min-height:100vh;
      min-height:100dvh;
      max-width:none;
      border-radius:0;
      border-left:none;
      border-right:none;
      border-top:none;
      border-bottom:none;
      overflow:hidden;
      box-shadow:none;
    }
    #sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:20;transition:left .24s cubic-bezier(.2,.3,.25,.9); width:260px;box-shadow:2px 0 16px rgba(16,24,40,0.10);}
    #sidebar.open{left:0;}
    #menuToggleBtn{display:flex;}
    #main{
      height:100vh;
      height:100dvh;
      min-height:0;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    #topbar{
      padding:14px 16px 12px;
      gap:9px;
      align-items:flex-start;
      background:#FFFFFF;
      border-bottom:1px solid var(--line-soft);
      position:relative;
      z-index:1;
      flex-shrink:0;
      box-shadow:0 4px 10px rgba(16,24,40,0.04);
    }
    .greet h1{font-size:19px;font-weight:700;letter-spacing:-.01em;}
    .greet p{font-size:11.5px;font-weight:500;}
    .pulse-wrap{width:100%;justify-content:space-between;gap:8px;}
    .pulse-label{font-size:8.5px;font-weight:700;}
    .stat-chips{width:100%;justify-content:space-between;gap:6px;}
    .chip{flex:1;min-width:0;padding:7px 9px;border-radius:11px;font-size:10px;}
    .chip b{font-size:14px;}
    .chip span{font-size:8px;letter-spacing:.06em;}
    .workspace-shell{
      padding:12px 10px 0;
      min-height:0;
      height:100%;
      flex:1;
      overflow:hidden;
    }
    .chat-panel{
      border-radius:18px;
      min-height:0;
      height:100%;
      max-height:100%;
      box-shadow:0 10px 26px rgba(16,24,40,0.10);
      display:flex;
      flex-direction:column;
      overflow:hidden;
      background:#FFFFFF;
      border:1px solid var(--line-soft);
    }
    #chatSubheader{padding:10px 14px 0; gap:7px;}
    #chatLog{
      padding:16px 14px 14px;
      gap:13px;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      scroll-padding-bottom:20px;
      min-height:0;
      flex:1 1 auto;
      background:#FFFFFF;
    }
    #quickRow{
      padding:10px 14px;
      gap:7px;
      overflow-x:auto;
      flex-wrap:nowrap;
      white-space:nowrap;
      scrollbar-width:none;
      background:#FBFCFE;
      border-top:1px solid var(--line-soft);
    }
    #quickRow::-webkit-scrollbar { display:none; }
    .quick{
      padding:9px 14px;
      font-size:12px;
      border-radius:999px;
      box-shadow:0 2px 8px rgba(16,24,40,0.04);
    }
    .quick:active{transform:scale(.96);}
    #inputRow{
      padding:12px 14px calc(12px + env(safe-area-inset-bottom));
      gap:10px;
      position:relative;
      bottom:auto;
      background:#FBFCFE;
      border-top:1px solid var(--line-soft);
      z-index:5;
      box-shadow:0 -6px 14px rgba(16,24,40,0.04);
      flex-shrink:0;
    }
    #chatInput{
      padding:11px 14px;
      font-size:16px;
      border-radius:12px;
      background:var(--surface);
    }
    #chatInput:focus{border-color:rgba(47, 111, 237, 0.50);box-shadow:0 0 0 3px rgba(47, 111, 237, 0.12);}
    #sendBtn{
      padding:0 16px;
      min-width:60px;
      border-radius:12px;
      font-size:13px;
      box-shadow:0 8px 18px rgba(47, 111, 237, 0.26);
    }
    #sendBtn:active{transform:scale(.95);}
    .msg{max-width:88%;gap:10px;}
    .msg.ai{animation:slideInLeft .4s cubic-bezier(.2,.7,.3,1);}
    .msg.user{animation:slideInRight .4s cubic-bezier(.2,.7,.3,1);}
    .bubble{
      font-size:13.5px;line-height:1.58;padding:11px 13px;border-radius:15px;
    }
    .auth-card{padding:22px 18px;border-radius:26px;border:1px solid var(--line-soft);}
    .auth-header h3{font-size:28px;}
    .auth-form input{
      padding:12px 14px;
      font-size:16px;
      border-radius:13px;
      border:1px solid var(--line);
    }
    .auth-actions{flex-direction:column;gap:11px;}
    .auth-actions .btn{padding:11px 14px;font-size:13px;}
    .form-grid{grid-template-columns:1fr;}
    .kanban{grid-template-columns:1fr;}
  }

  @media(max-width:480px){
    .brand{padding-bottom:18px;gap:9px;}
    .brand-mark{width:32px;height:32px;border-radius:9px;font-size:15px;}
    .brand-text b{font-size:15px;}
    .brand-text span{font-size:9px;letter-spacing:.06em;}
    .nav-btn{padding:10px 11px;border-radius:9px;font-size:13px;font-weight:500;gap:9px;}
    .nav-btn:hover{transform:translateX(3px);}
    .nav-btn.active{box-shadow:0 4px 10px rgba(47, 111, 237, 0.12);}
    #topbar{flex-direction:column;align-items:stretch;padding:13px 15px 11px;}
    .stat-chips{justify-content:space-between;gap:5px;}
    .chip{flex:1;min-width:0;padding:6px 7px;font-size:9px;border-radius:10px;}
    .chip b{font-size:13px;}
    .chip span{font-size:7.5px;}
    .chat-panel{border-radius:14px;box-shadow:0 8px 22px rgba(16,24,40,0.08);}
    .bubble{padding:10px 12px;font-size:13px;line-height:1.56;border-radius:14px;}
    .msg.ai .bubble{border-top-left-radius:3px;}
    .msg.user .bubble{border-top-right-radius:3px;}
    .avatar{width:28px;height:28px;font-size:12px;border-radius:7px;}
    #sendBtn{padding:0 13px;min-width:56px;border-radius:11px;font-size:12.5px;box-shadow:0 6px 14px rgba(47, 111, 237, 0.24);}
    #sendBtn:hover{transform:translateY(-1px);}
    #chatInput{font-size:16px;padding:10px 12px;border-radius:11px;}
    #chatInput:focus{border-color:rgba(47, 111, 237, 0.55);}
    #imagePreviewRow{padding-left:14px;padding-right:14px;}
    #chatSubheader .btn.small{padding:6px 8px; font-size:11px;border-radius:9px;}
    .quick{padding:8px 12px;font-size:11.5px;border-radius:999px;box-shadow:0 2px 8px rgba(16,24,40,0.04);}
    .quick:hover{transform:none;}
    .quick:active{transform:scale(.94);transition:transform .1s ease;}
    .history-item{padding:9px 10px;border-radius:11px;}
    .history-title{font-size:12px;}
    .history-meta{font-size:9.5px;margin-top:2px;}
    .mini-action{width:22px;height:22px;border-radius:7px;font-size:10px;}
    .tiny-btn{padding:4px 7px;border-radius:7px;font-size:9.5px;}
    .section-label{font-size:8.5px;letter-spacing:.1em;}
    .pick{padding:7px 11px;font-size:12px;border-radius:18px;}
    .auth-card{padding:20px 17px;border-radius:24px;}
    .auth-header h3{font-size:26px;}
    .auth-pill{font-size:10px;padding:5px 8px;}
    .auth-form label{font-size:10.5px;letter-spacing:.07em;}
    .auth-form input{padding:11px 13px;font-size:15px;border-radius:12px;}
    .auth-actions{flex-direction:column;gap:10px;}
    .auth-actions .btn{padding:10px 13px;font-size:12.5px;border-radius:11px;font-weight:600;}
    .logout-btn{padding:9px 11px;border-radius:11px;}
  }

  /* ---------- ANIMATIONS ---------- */
  @keyframes fadeSlideUp{
    from{opacity:0;transform:translateY(12px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
  }
  @keyframes popIn{
    0%{opacity:0;transform:scale(.88);}
    65%{transform:scale(1.06);}
    100%{opacity:1;transform:scale(1);}
  }
  @keyframes softPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(34, 197, 94, .35);}
    50%{box-shadow:0 0 0 8px rgba(34, 197, 94, 0);}
  }
  @keyframes glow{
    0%,100%{text-shadow:0 0 6px rgba(47, 111, 237, .18);}
    50%{text-shadow:0 0 12px rgba(47, 111, 237, .32);}
  }
  @keyframes shimmer{
    0%{background-position:-1000px 0;}
    100%{background-position:1000px 0;}
  }
  @keyframes slideInRight{
    from{opacity:0;transform:translateX(20px);}
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes slideInLeft{
    from{opacity:0;transform:translateX(-20px);}
    to{opacity:1;transform:translateX(0);}
  }
  @keyframes toastIn{
    from{opacity:0;transform:translateY(14px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }
  @keyframes splashFade{
    0%{opacity:1;}
    100%{opacity:0;visibility:hidden;}
  }
  @keyframes markSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes float{
    0%,100%{transform:translateY(0px);}
    50%{transform:translateY(-4px);}
  }

  .view.active{animation:fadeIn .35s cubic-bezier(.2,.3,.25,.9);}
  .msg{animation:fadeSlideUp .42s cubic-bezier(.2,.7,.3,1) both;}
  .chip-row .pick{animation:popIn .32s cubic-bezier(.34,.1,.68,.55) both;}
  .chip-row .pick:nth-child(1){animation-delay:.04s;}
  .chip-row .pick:nth-child(2){animation-delay:.09s;}
  .chip-row .pick:nth-child(3){animation-delay:.14s;}
  .chip-row .pick:nth-child(4){animation-delay:.19s;}
  .chip-row .pick:nth-child(5){animation-delay:.24s;}
  .chip-row .pick:nth-child(6){animation-delay:.27s;}

  .nav-btn{transition:background .18s ease, color .18s ease, transform .15s ease;}
  .nav-btn:active{transform:scale(.97);}
  .nav-btn.active{animation:fadeIn .2s ease;}

  .btn, .pick, .quick, #sendBtn{transition:transform .12s ease, background .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease;}
  .btn:active, .pick:active, .quick:active, #sendBtn:active{transform:scale(.95);}

  .metric, .kcard, .report-block{animation:fadeSlideUp .35s ease both;}
  .chip{transition:transform .15s ease;}
  .chip:hover{transform:translateY(-2px);}

  #pulseSvg path{transition:d .6s ease;}

  .brand-mark{transition:transform .4s ease;}
  .brand:hover .brand-mark{transform:rotate(-6deg) scale(1.05);}

  .typing-dots{display:inline-flex;gap:4px;padding:4px 2px;}
  .typing-dots span{
    width:6px;height:6px;border-radius:50%;background:var(--primary);
    animation:typingBounce 1.1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes typingBounce{
    0%,60%,100%{transform:translateY(0);opacity:.5;}
    30%{transform:translateY(-5px);opacity:1;}
  }

  /* ---------- INSTALL PROMPT ---------- */
  #installBtn{
    display:none;align-items:center;gap:7px;
    background:var(--accent-bg);border:1px solid var(--accent-dim);color:var(--accent-dim);
    padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:600;
    animation:softPulse 2.4s infinite;
  }
  #installBtn:hover{background:var(--accent);color:#FFFFFF;}
  #installBtn.show{display:inline-flex;}

  #installToast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#FFFFFF;border:1px solid var(--line);color:var(--text0);
    padding:12px 18px;border-radius:10px;font-size:13px;
    display:none;align-items:center;gap:12px;z-index:50;
    box-shadow:0 14px 34px rgba(16,24,40,0.18);
    animation:toastIn .3s ease;
  }
  #installToast.show{display:flex;}
  #installToast button{
    background:var(--accent);border:none;color:#FFFFFF;font-weight:600;
    padding:6px 12px;border-radius:7px;font-size:12px;
  }
  #installToast .dismiss{background:transparent;color:var(--text2);padding:6px 8px;}

  /* ---------- SPLASH ---------- */
  #splash{
    position:fixed;inset:0;background:var(--bg0);z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  }
  #splash.hide{animation:splashFade .5s ease forwards;pointer-events:none;}
  .splash-mark{
    width:88px;height:88px;border-radius:22px;
    background:#FFFFFF;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    box-shadow:0 20px 44px rgba(47, 111, 237, 0.24), 0 2px 6px rgba(16,24,40,0.12);
    animation:popIn .5s cubic-bezier(.2,.8,.3,1) both;
  }
  .splash-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .splash-ring{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line); border-top-color:var(--primary);
    animation:markSpin .9s linear infinite;
  }
  .splash-text{font-family:var(--serif);font-size:13px;color:var(--text2);letter-spacing:.03em;}
</style>

</head>
<body>

<div id="splash">
  <div class="splash-mark"><img src="icon-192.png" alt="C.S Company"></div>
  <div class="splash-ring"></div>
  <div class="splash-text" id="splashText">CS AI</div>
</div>

<div id="installToast">
  <span>📲 Ku rakib app-ka gudaha shaqada — maqal degdeg ah, offline u shaqeeya.</span>
  <button id="installToastBtn">Rakib</button>
  <button class="dismiss" id="installToastDismiss">Maya</button>
</div>

<div id="authOverlay">
  <div class="auth-card">
    <div class="auth-header">
      <h3 id="authTitle">Welcome</h3>
    </div>
    <div id="authMessage"></div>
    <div class="auth-form">
      <div id="authNameWrap">
        <label for="authName">Your name (optional)</label>
        <input id="authName" type="text" placeholder="Enter your name (optional)" autocomplete="name">
      </div>
      <div class="auth-actions">
        <button class="btn primary" id="authSubmitBtn" type="button">Continue</button>
      </div>
    </div>
  </div>
</div>

<div id="app">

  <div id="sidebarBackdrop"></div>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="icon-192.png" alt="C.S Company"></div>
      <div class="brand-text"><b>CS AI</b><span>Personal assistant</span></div>
    </div>
    <nav id="navList">
      <button class="nav-btn active" data-view="chatView" aria-label="Chat"><span class="ic">💬</span>Chat</button>
    </nav>

    <div class="sidebar-section">
      <div class="section-label">
        <span>History</span>
        <button class="tiny-btn" id="newChatSidebarBtn" type="button">+ New</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="sidebar-foot">
      <b id="currentUserLabel">Guest</b>
      <div class="db-status"><span class="dot" id="dbDot"></span><span id="dbStatusText">Database: connected</span></div>
      <button class="logout-btn" id="logoutBtn" type="button">Log out</button>
    </div>
  </aside>

  <div id="main">
    <div id="topbar">
      <div class="topbar-head">
        <button id="menuToggleBtn" type="button" aria-label="Menu">☰</button>
        <div class="topbar-logo"><img src="icon-192.png" alt="C.S Company"></div>
        <div class="greet">
          <h1 id="greetTitle">CS AI</h1>
          <p id="greetDate"></p>
        </div>
      </div>
      <div class="stat-chips" id="statChips"></div>
      <button id="installBtn">⬇️ Install app</button>
      <div class="pulse-wrap" style="display:none;">
        <div class="pulse-label">Business<br>Pulse</div>
        <svg id="pulseSvg" viewBox="0 0 120 36"><path id="pulsePath" d="M0,18 L120,18" stroke="#C9A15A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <!-- CHAT VIEW -->
    <div class="view active" id="chatView">
      <div class="workspace-shell">
        <div class="chat-panel">
          <div id="chatSubheader">
            <button class="btn small" id="historyBtn" type="button">🕘 History</button>
            <button class="btn small" id="newChatBtn" type="button">🆕 New chat</button>
          </div>
          <div id="chatLog"></div>
          <div id="historyPanel"></div>
          <div id="imagePreviewRow">
            <img id="imagePreviewThumb" alt="image preview">
            <button class="btn small" id="removeImageBtn" type="button">✕ Remove image</button>
          </div>
          <div id="quickRow"></div>
          <div id="inputRow">

// Haddii xog hore ay ka maqnaan jirtay jawaab (khalad internet ah), tan ayaa hagaajisa isku xirka.
function sanitizeConversation(arr){
  const out = [];
  arr.forEach(function(m){
    if(!m || (!m.content && !m.image)) return;
    const last = out[out.length-1];
    if(last && last.role === m.role && !m.image && !last.image){
      last.content = (last.content||'') + '\n' + (m.content||'');
    } else {
      const entry = { role: m.role, content: m.content || '' };
      if(m.image) entry.image = m.image;
      out.push(entry);
    }
  });
  if(out.length && out[0].role !== 'user') out.shift();
  return out;
}

function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise(function(_, reject){
    timer = setTimeout(function(){ reject(new Error((label || 'Request') + ' timed out')); }, ms);
  });
  return Promise.race([promise, timeout]).finally(function(){ clearTimeout(timer); });
}

function drawPulse(intensity){
  const amp = 4 + intensity*1.6;
  const w=120,h=36,mid=18;
  let d = 'M0,'+mid+' ';
  const segs = 6;
  for(let i=0;i<segs;i++){
    const x0 = (w/segs)*i, x1 = (w/segs)*(i+1);
    if(i === 2){
      d += 'L'+(x0+4)+','+mid+' L'+(x0+8)+','+(mid-amp)+' L'+(x0+13)+','+(mid+amp*0.7)+' L'+(x0+18)+','+mid+' L'+x1+','+mid+' ';
    } else {
      d += 'L'+x1+','+mid+' ';
    }
  }
  document.getElementById('pulsePath').setAttribute('d', d);
}

function renderMessageContent(container, text){
  const fenceRegex = /```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  let found = false;
  while((match = fenceRegex.exec(text)) !== null){
    found = true;
    const before = text.slice(lastIndex, match.index);
    if(before.trim()){
      const p = document.createElement('div');
      p.textContent = before;
      p.style.whiteSpace = 'pre-line';
      container.appendChild(p);
    }
    const lang = (match[1] || '').trim();
    const code = match[2].replace(/\n$/, '');
    const wrap = document.createElement('div');
    wrap.className = 'code-block';
    const header = document.createElement('div');
    header.className = 'code-block-header';
    const langLabel = document.createElement('span');
    langLabel.textContent = lang || 'code';
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'code-copy-btn';
    copyBtn.textContent = 'Copy';
    copyBtn.onclick = function(){
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){
          copyBtn.textContent = 'Copied!';
          setTimeout(function(){ copyBtn.textContent = 'Copy'; }, 1500);
        });
      }
    };
    header.appendChild(langLabel);
    header.appendChild(copyBtn);
    const pre = document.createElement('pre');
    const codeEl = document.createElement('code');
    codeEl.textContent = code;
    pre.appendChild(codeEl);
    wrap.appendChild(header);
    wrap.appendChild(pre);
    container.appendChild(wrap);
    lastIndex = fenceRegex.lastIndex;
  }
  const rest = text.slice(lastIndex);
  if(rest.trim() || !found){
    const p = document.createElement('div');
    p.textContent = rest;
    p.style.whiteSpace = 'pre-line';
    container.appendChild(p);
  }
}

      // fariinta dhabta ah (tan aan edge function-ku soo celiyay) waxay ku jirtaa .context (Response).
      let detail = res.error.message || 'Khalad aan la garanayn.';
      if(res.error.context && typeof res.error.context.json === 'function'){
        try{
          const errBody = await res.error.context.json();
          if(errBody && errBody.error){
            detail = (typeof errBody.error === 'string') ? errBody.error : (errBody.error.message || JSON.stringify(errBody.error));
          }
        }catch(readErr){ /* body ma ahayn JSON, isticmaal fariintii hore */ }
      }
      throw new Error(detail);
    }
    const data = res.data || {};
    if(data.error){
      const msg = (typeof data.error === 'string') ? data.error : (data.error.message || JSON.stringify(data.error));
      throw new Error(msg);
    }
    const candidate = (data.candidates && data.candidates[0]) || null;
    const parts = (candidate && candidate.content && candidate.content.parts) || [];

  }catch(err){
    console.error('askAI failed', err);
    hideTyping();
    const raw = (err && err.message) ? err.message : '';

function handleUserInput(raw, image){
  const text = (raw||'').trim();
  if(!text && !image) return;
  addMsg(text, 'user', null, image ? image.previewUrl : null);

  if(image){
    askAI(text || 'Fadlan sharax sawirkan oo ii sheeg waxa uu ka koobnaa.', image, true);
    return;
  }

  if(flowState){
    stepFlow(text);
    return;
  }

  const t = text.toLowerCase();

  if(/\bsawir(ro)?\b|\bimage\b|\bpicture\b|\bphoto\b/i.test(t)){
    askAI(text, null, true);
    return;
  }

  if(/daal|naxdin|khamas/.test(t)){
    addMsg('Waan fahmay.\nMaanta ha isku qasbin 20 hawlood.\nAynu dooranno hal shaqo oo haddii la dhammeeyo maalinta guul noqonaysa.', 'ai',
      ['Ku dar Mashruuc cusub', 'Warbixin Toddobaad', 'Soo koob maanta']);
    return;
  }

  if(/macmiil ma hayo|macmiil.*ma jiro|ma helayo macmiil/.test(t)){
    addMsg('Ha welwelin.\nAan samayno qorshe.\nMaanta:\n• La xiriir 5 ganacsi.\n• Soo geli hal muuqaal Facebook.\n• Soo geli hal muuqaal TikTok.\n• U dir 10 WhatsApp Business.', 'ai',
      ['Diiwaan geli macmiil cusub','Waxaan rabaa lacag badan']);
    return;
  }

  if(/lacag/.test(t)){
    addMsg('Lacagtu waxay ka timaaddaa macaamiisha.\nAynu eegno halka ay ka iman karaan toddobaadkan.', 'ai',
      ['Hospital','Clinic','Pharmacy','School','Supermarket','Restaurant','Company']);
    return;
  }

  if(['hospital','clinic','pharmacy','school','supermarket','restaurant','company'].indexOf(t) !== -1){
    addMsg('Fiican. ' + text + ' waa suuq weyn oo Muqdisho ku bandhig karta HMS ama nidaam maamul.\nMa rabtaa inaan kuu diiwaan geliyo macmiil cusub oo noocaas ah?', 'ai',
      ['Diiwaan geli macmiil cusub','Maya, mar dambe']);
    return;
  }

  if(/customer cusub|macmiil cusub|diiwaan geli/.test(t)){
    startCustomerFlow();
    return;
  }

  if(/warbixin.*toddobaad|weekly/.test(t)){
    weeklyMeeting();
    return;
  }

  if(/warbixin.*bil|monthly/.test(t)){
    monthlySummary();
    return;
  }

  if(/soo koob maanta|koobmaanta/.test(t)){
    dailySummary();
    return;
  }

  if(/qorshe|muhiim ah/.test(t)){
    const p = pendingTasksMessage();
    addMsg(p, 'ai', ['Waan daalay','Macmiil ma hayo','Warbixinta Toddobaadka']);
    return;
  }

  if(/wax walba way iga qaldan|qaldan yihiin|xanaaq/.test(t)){
    reframeMessage();
    return;
  }

  // Su'aal kasta oo aan la garanayn oo dhamaystiran -> AI dhabta ah (Claude + internet search)
  askAI(text);
}

let pendingImage = null; // {mimeType, data (base64, no prefix), previewUrl}

function resizeImageFile(file, maxDim){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

        messages: [{ role:'user', content: prompt }]

    if(res.error){
      let detail = res.error.message || 'Khalad aan la garanayn.';
      if(res.error.context && typeof res.error.context.json === 'function'){

          const errBody = await res.error.context.json();

          }
        }catch(readErr){ /* body ma ahayn JSON */ }

    if(data.error){
      const msg = (typeof data.error === 'string') ? data.error : (data.error.message || JSON.stringify(data.error));

    const candidate = (data.candidates && data.candidates[0]) || null;

    const textPart = parts.filter(function(p){ return typeof p.text === 'string'; }).map(function(p){ return p.text; }).join('\n').trim();

function renderProjects(){
  const wrap = document.getElementById('kanbanWrap');
  if(!wrap) return;
  const cols = [
    {status:'started', label:'Active'},
    {status:'completed', label:'Completed'},
    {status:'delayed', label:'Delayed'}
  ];
  wrap.innerHTML = cols.map(function(col){
    const items = projects.filter(function(p){ return p.status===col.status; });
    const cards = items.length ? items.map(function(p){
      return '<div class="kcard"><b>'+p.name+'</b><div class="meta">'+(p.client||'')+'</div><div class="krow">'+
        (col.status!=='started'?'<button class="btn small" onclick="setProjStatus(\''+p.id+'\',\'started\')">Socda</button>':'')+
        (col.status!=='completed'?'<button class="btn small" onclick="setProjStatus(\''+p.id+'\',\'completed\')">Dhammee</button>':'')+
        (col.status!=='delayed'?'<button class="btn small" onclick="markDelayed(\''+p.id+'\')">Dib u dhac</button>':'')+
      '</div></div>';
    }).join('') : '<div class="empty" style="padding:14px 0;">Waxba ma jiraan</div>';
    return '<div class="kcol"><h3>'+col.label+' ('+items.length+')</h3>'+cards+'</div>';
  }).join('');
}
async function setProjStatus(id, status){
  const p = projects.find(function(x){ return x.id===id; });
  if(!p) return;
  const patch = { status: status };
  if(status==='started' && !p.started_at) patch.started_at = todayStr();
  if(status==='completed') patch.completed_at = todayStr();
  const updated = await sbUpdate('csco_projects', id, patch);
  if(updated){ Object.assign(p, updated); renderProjects(); renderHeader(); }
}
async function markDelayed(id){
  const reason = prompt('Sababta dib u dhaca (ikhtiyaari):','Waqtiga');
  const p = projects.find(function(x){ return x.id===id; });
  if(!p) return;
  const updated = await sbUpdate('csco_projects', id, { status:'delayed', delay_reason: reason || 'Waqtiga' });
  if(updated){ Object.assign(p, updated); renderProjects(); renderHeader(); }
}

/* ================= PWA: INSTALL PROMPT ================= */
let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');
const installToast = document.getElementById('installToast');
const installToastBtn = document.getElementById('installToastBtn');
const installToastDismiss = document.getElementById('installToastDismiss');

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

window.addEventListener('beforeinstallprompt', function(e){
  e.preventDefault();
  deferredInstallPrompt = e;
  if(!isStandalone()){
    if(installBtn) installBtn.classList.add('show');
    if(!sessionStorage.getItem('csco_toast_dismissed') && installToast){
      setTimeout(function(){ installToast.classList.add('show'); }, 1800);
    }
  }
});

function triggerInstall(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(function(){
    deferredInstallPrompt = null;
    if(installBtn) installBtn.classList.remove('show');
    if(installToast) installToast.classList.remove('show');
  });
}
if(installBtn) installBtn.onclick = triggerInstall;
if(installToastBtn) installToastBtn.onclick = triggerInstall;
if(installToastDismiss) installToastDismiss.onclick = function(){
  if(installToast) installToast.classList.remove('show');
  sessionStorage.setItem('csco_toast_dismissed', '1');
};

window.addEventListener('appinstalled', function(){
  if(installBtn) installBtn.classList.remove('show');
  if(installToast) installToast.classList.remove('show');
  deferredInstallPrompt = null;
});

function bindAuthHandlers(){
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const newChatSidebarBtn = document.getElementById('newChatSidebarBtn');
  const menuToggleBtn = document.getElementById('menuToggleBtn');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const sidebarEl = document.getElementById('sidebar');

  if(authSubmitBtn){ authSubmitBtn.onclick = handleAuthSubmit; }
  if(logoutBtn){ logoutBtn.onclick = logoutCurrentUser; }
  if(newChatSidebarBtn){ newChatSidebarBtn.onclick = function(){ if(currentUser) createNewChatSession(); }; }

  function closeSidebar(){
    if(sidebarEl) sidebarEl.classList.remove('open');
    if(sidebarBackdrop) sidebarBackdrop.classList.remove('show');
  }
  function openSidebar(){
    if(sidebarEl) sidebarEl.classList.add('open');
    if(sidebarBackdrop) sidebarBackdrop.classList.add('show');
  }
  if(menuToggleBtn){
    menuToggleBtn.onclick = function(){
      if(sidebarEl && sidebarEl.classList.contains('open')){ closeSidebar(); } else { openSidebar(); }
    };
  }
  if(sidebarBackdrop){ sidebarBackdrop.onclick = closeSidebar; }
  // Taariikhda/wada-hadal cusub oo laga doorto sidebar-ka mobile-ka -> xir sidebar-ka
  if(newChatSidebarBtn){
    const prevHandler = newChatSidebarBtn.onclick;
    newChatSidebarBtn.onclick = function(){ if(prevHandler) prevHandler(); closeSidebar(); };
  }
  if(logoutBtn){
    const prevLogout = logoutBtn.onclick;
    logoutBtn.onclick = function(){ if(prevLogout) prevLogout(); closeSidebar(); };
  }
}

function syncViewportHeight(){
  const visualViewport = window.visualViewport || null;
  const viewportHeight = visualViewport ? visualViewport.height : window.innerHeight;
  const viewportWidth = visualViewport ? visualViewport.width : window.innerWidth;
  const keyboardOffset = visualViewport
    ? Math.max(0, window.innerHeight - viewportHeight)
    : 0;

  document.documentElement.style.setProperty('--vh', (viewportHeight * 0.01) + 'px');
  document.documentElement.style.setProperty('--app-vh', viewportHeight + 'px');
  document.documentElement.style.setProperty('--keyboard-offset', String(Math.min(keyboardOffset, viewportHeight * 0.45)) + 'px');

  if(window.innerWidth <= 820){
    document.body.style.minHeight = viewportHeight + 'px';
  }
}

function keepComposerVisible(){
  const input = document.getElementById('chatInput');
  const chatLog = document.getElementById('chatLog');
  if(!input || !chatLog) return;

  const adjustComposer = function(){
    if(window.innerWidth > 820) {
      document.documentElement.style.setProperty('--keyboard-offset', '0px');
      return;
    }

    const visualViewport = window.visualViewport;
    const keyboardOffset = visualViewport ? Math.max(0, window.innerHeight - visualViewport.height) : 0;
    document.documentElement.style.setProperty('--keyboard-offset', String(Math.min(keyboardOffset, window.innerHeight * 0.45)) + 'px');

    if(!visualViewport) return;

    const inputRect = input.getBoundingClientRect();
    const visibleBottom = visualViewport.height - 16;
    const needsScroll = inputRect.bottom > visibleBottom;

    if(needsScroll){
      const delta = inputRect.bottom - visibleBottom + 10;
      chatLog.scrollTop += delta;
    }
  };

  input.addEventListener('focus', function(){
    setTimeout(adjustComposer, 150);
  });
  input.addEventListener('input', adjustComposer);
  input.addEventListener('blur', function(){
    document.documentElement.style.setProperty('--keyboard-offset', '0px');
  });

  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', adjustComposer);
    window.visualViewport.addEventListener('scroll', adjustComposer);
  }
}

async function initializeApp(){
  if(appInitialized) return;
  appInitialized = true;

  syncViewportHeight();
  bindAuthHandlers();
  keepComposerVisible();

  currentUser = getCurrentUser();

  if(currentUser){
    ensureAuthUi();
    renderHistoryList();
    if(getUserChats().length){
      currentChatSession = getUserChats()[0];
      loadSession(currentChatSession.id);
    } else {
      createNewChatSession();
    }
  } else {
    ensureAuthUi();
  }

  const minDelay = new Promise(function(res){ setTimeout(res, 600); });
  await Promise.all([loadAllData(), minDelay]);
  renderHeader();
  if(currentUser && !currentChatSession){ createNewChatSession(); }
  if(currentUser && !aiConversation.length) openingBrief();
  if(currentUser && !dataReady){
    addMsg('⚠️ Ma gaadhi karo database-ka (Supabase) hadda — internetka hubi, ama haddii aad hosting adigu isticmaasho, hubi inaysan xayirin *.supabase.co. Chat-ku wuu shaqayn karaa laakiin xogtaadu si joogto ah looma kaydin doono ilaa xiriirku soo noqdo.', 'ai');
  }

  const splash = document.getElementById('splash');
  if(splash){
    splash.classList.add('hide');
    setTimeout(function(){ splash.remove(); }, 550);
  }

  if(!window.__csaiPulseInterval){
    window.__csaiPulseInterval = setInterval(pulseTick, 2600);
  }
}

window.addEventListener('resize', syncViewportHeight);
window.addEventListener('orientationchange', syncViewportHeight);
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', syncViewportHeight);
  window.visualViewport.addEventListener('scroll', syncViewportHeight);
}
window.addEventListener('load', function(){
  syncViewportHeight();
  initializeApp();
});
window.addEventListener('focusin', function(){
  setTimeout(syncViewportHeight, 80);
});
window.addEventListener('focusout', function(){
  setTimeout(function(){
    document.documentElement.style.setProperty('--keyboard-offset', '0px');
  }, 80);
});

if(document.readyState === 'complete' || document.readyState === 'interactive'){
  initializeApp();
}
</script>
